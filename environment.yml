name: ppi-splitting-pipeline
channels:
  - conda-forge
  - bioconda
  - defaults
# Every package pinned to its latest stable release as of 2026-09-29, so the
# conda profile and docker/Dockerfile (which installs this file and nothing
# else) resolve one exact toolchain. Bump deliberately.
dependencies:
  - python=3.14.7
  - certifi=2026.7.22
  - blast=2.17.0
  - cd-hit=4.8.1
  - kahip=3.25
  - multiqc=1.35
  - scikit-learn=1.9.1
  - numpy=2.5.3
  - matplotlib=3.11.2
  - plotly=7.1.0
  - pyscipopt=6.2.1
  - pip:
    # The default PyPI wheel, which for 2.14.0 is built against CUDA 13.0. The
    # wheel's CUDA major must not exceed the node driver's (minors are
    # compatible): on an older driver torch.cuda.is_available() silently returns
    # False. EMBED_SEQUENCES under -profile gpu then errors via --require-gpu
    # rather than running on CPU (see CLAUDE.md).
    - torch==2.14.0
    - transformers==5.17.0
    - sentencepiece==0.2.2
    - protobuf==7.36.2
    - cvxpy[GUROBI]==1.9.3
    - gurobipy==13.0.3  # what cvxpy's [GUROBI] extra installs, pinned
    - highspy==1.15.1   # OSS MIP fallback for sample_negatives_ilp.py when Gurobi is unavailable
    - pyyaml==6.0.3     # --config YAML for sample_negatives_ilp.py --batch
